name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip uninstall -y numpy pandas matplotlib scipy; if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          python -c "import openpyxl; print('openpyxl', openpyxl.__version__)"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Executable (Windows)
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist-onedir SheetDataHub.spec
          New-Item -ItemType Directory -Force -Path dist_final | Out-Null
          Compress-Archive -Path dist-onedir\SheetDataHub -DestinationPath dist_final\SheetDataHub-windows.zip -Force

      - name: Build Installer
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist-installer --workpath build-installer SheetDataHubInstaller.spec
          $setup = Get-ChildItem dist-installer -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw 'Installer exe not found' }
          Copy-Item -Path $setup.FullName -Destination dist_final\SheetDataHub-Setup.exe -Force
          Get-ChildItem dist_final | Format-Table Name, Length

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist_final/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_final/*
          generate_release_notes: true
